	<body id="b">
        <div id="wrapper">

            <p class="white">— The next morning —</p>

            <p class="white"> KNOCK.KNOCK.KNOCK.</p>

            <img src="../../Images/door.png" id="pic">
            

           <div id="textbox_01">
             <p id="pet_name"></p>
           </div>

           <p class="white"> Who should I choose to trust? </p>
            
           <!-- save the player's answer before moving on -->
           <!--Using <a> as a button: href="#" prevents default navigation.
            onclick is used to run goEnding(), which decides the next page based on player choice.-->
            <nav>
                <a href="#" onclick="goEnding('protect')">PROTECT IT</a>
                <a href="#" onclick="goEnding('open')">OPEN THE DOOR</a>
            </nav>

        </div>
    </body>

<!--  href = "#" : https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/a
It says in the website : Anchor elements are often abused as fake buttons by setting their href to # 
then listening for their click events. -->
